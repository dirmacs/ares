[package]
name = "ares-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "LLM provider clients and abstractions for ARES"

[features]
default = ["genai"]
# Compile-time factory collection (mirrors the server root feature)
inventory = ["dep:inventory", "cordis/inventory"]
genai = ["dep:genai"]
llamacpp = ["dep:llama-cpp-2"]
llamacpp-cuda = ["llamacpp", "llama-cpp-2/cuda"]
llamacpp-metal = ["llamacpp", "llama-cpp-2/metal"]
llamacpp-vulkan = ["llamacpp", "llama-cpp-2/vulkan"]
postgres = ["dep:sqlx", "ares-store/postgres"]

[dependencies]
ares-types = { workspace = true }
ares-tools = { workspace = true }
ares-store = { workspace = true, optional = true }
cordis = { workspace = true, default-features = false }
inventory = { workspace = true, optional = true }
chrono = { workspace = true }
sqlx = { workspace = true, optional = true }
async-stream = "0.3.6"
async-trait = { workspace = true }
futures = "0.3.31"
arc-swap = "1.7"
parking_lot = "0.12.5"
schemars = { version = "1.1.0", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
llama-cpp-2 = { version = "0.1.130", optional = true }
genai = { version = "0.7.0-beta.19", default-features = false, features = ["rustls-tls"], optional = true }
reqwest = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
wiremock = "0.6.5"
