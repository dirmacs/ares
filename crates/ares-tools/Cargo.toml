[package]
name = "ares-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Built-in agent tools for A.R.E.S"

[features]
default = []
search-tools = ["dep:daedra", "dep:scraper"]
mcp = ["dep:ares-mcp", "ares-mcp/mcp", "dep:tracing"]
postgres = ["dep:sqlx", "dep:ares-db"]

[dependencies]
ares-types = { workspace = true }
ares-config = { workspace = true }
ares-db = { workspace = true, optional = true }
arc-swap = "1.7.1"
ares-mcp = { workspace = true, optional = true }
async-trait = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12.26", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
daedra = { version = "0.1.4", optional = true }
scraper = { version = "0.25.0", optional = true }
boa_engine = "0.20"
sqlx = { workspace = true, optional = true }

[dev-dependencies]
ares-mcp = { workspace = true, features = ["mcp"] }
daedra = { version = "0.1.4" }
scraper = { version = "0.25.0" }
tokio = { workspace = true }
toml = "0.9.8"
wiremock = "0.6.5"
sqlx = { workspace = true }
