name: Open Source Guard
on: [push, pull_request]
jobs:
  check:
    runs-on: [self-hosted, Linux, ARM64, dirmacs-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Check for proprietary leaks
        run: |
          # The ehealth term is word-bounded on purpose: without the boundary
          # it is a substring of "telehealth", which is an ordinary word in
          # config/agents/appointment-reminder.toon. A guard that fires on
          # correct text is worse than no guard, so keep the \b.
          TERMS="kas""ino|eh""b|\behe""alth|dink""edin|dspr""int|dirm""acs-serv""ice-key|bom@dirm""acs|eruka-con""text\.toml"
          # Live business figures: a dollar amount attached to a per-month
          # price, to a monthly recurring revenue line, or to an annual run
          # rate. These are shapes rather than names, so unlike the terms
          # above there is no word here worth splitting.
          FIGURES='\$[0-9]{1,3}(,[0-9]{3})*/mo|MRR: \$[0-9]|\$[0-9]{1,3}(,[0-9]{3})* ARR'
          # Everything the repository ships. The previous list omitted
          # config/, ui/, scripts/, hurl/ and the root documents, so a file
          # outside the old list was never checked for anything.
          SCAN="src/ crates/ tests/ docs/ examples/ config/ ui/ scripts/ hurl/ README.md AGENTS.md ARCHITECTURE.md CHANGELOG.md CLAUDE.md CONTRIBUTING.md SECURITY.md ares.example.toml"
          if grep -rnE "$TERMS|$FIGURES" $SCAN 2>/dev/null; then
            echo "::error::Proprietary content detected in open-source repo"
            exit 1
          fi
          echo "No proprietary content found"
      - name: Check for committed credentials
        run: |
          SCAN="src/ crates/ tests/ docs/ examples/ config/ ui/ scripts/ hurl/ README.md AGENTS.md ARCHITECTURE.md CHANGELOG.md CLAUDE.md CONTRIBUTING.md SECURITY.md ares.example.toml"
          LEAKS=$(grep -rInE \
            '-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY|AKIA[0-9A-Z]{16}|postgres(ql)?://[^/[:space:]]+:[^/[:space:]]+@|xox[baprs]-[A-Za-z0-9-]{10,}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}' \
            $SCAN 2>/dev/null | grep -vE 'localhost|127\.0\.0\.1|example\.|<' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Credential-like content committed:"
            echo "$LEAKS"
            exit 1
          fi
          echo "No credential-like content found"
