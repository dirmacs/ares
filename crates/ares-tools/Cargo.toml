[package]
name = "ares-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "Built-in tools for ARES agents"

[features]
default = ["appa-gate"]
# Compile-time factory collection (mirrors the server root feature)
inventory = ["dep:inventory", "cordis/inventory"]
search-tools = ["dep:daedra", "dep:scraper"]
# The APPA pre-call gate. On by default so behaviour is unchanged; a consumer
# that cannot fetch the git dependency can turn it off with
# default-features = false.
appa-gate = ["dep:appa", "dep:appa-runtime-api", "dep:appa-eventlog"]
mcp = ["dep:ares-mcp", "ares-mcp/mcp", "ares-mcp/postgres"]
postgres = ["dep:sqlx", "dep:ares-store", "ares-store/postgres"]
# Sandboxed script engines (boa JS + rhai); the root facade enables this by default
script-tools = ["dep:boa_engine", "dep:rhai"]

[dependencies]
ares-types = { workspace = true }
toml = { workspace = true }
base64 = "0.22"
urlencoding = "2.1"
# The OpenAPPA embed: the gate at the Tools::execute funnel.
# APPA (the pre-call tool gate) is a git dependency on archestra-ai/OpenAPPA,
# whose workspace sets `publish = false` — those crates cannot come from
# crates.io. Making them optional is what lets this crate publish at all.
# The gate is not lost: the server root enables `appa-gate`, so every build we
# ship still carries it. Only a bare `ares-tools` consumer who ignores the
# feature gets a crate without the gate, and the gated types are absent rather
# than silently degraded.
appa = { workspace = true, optional = true }
appa-runtime-api = { workspace = true, optional = true }
appa-eventlog = { workspace = true, optional = true }
ares-store = { workspace = true, optional = true }
cordis = { workspace = true }
inventory = { workspace = true, optional = true }
arc-swap = "1.7.1"
ares-mcp = { workspace = true, optional = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
# `raw_value` carries a proposed call's arguments as the bytes they were
# spelled, which the OpenAPPA engine requires.
serde_json = { workspace = true, features = ["raw_value"] }
tracing = { workspace = true }
daedra = { version = "0.5.12", default-features = false, optional = true }
scraper = { version = "0.25.0", optional = true }
boa_engine = { version = "0.20", optional = true }
rhai = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
ares-test-support = { workspace = true }
ares-mcp = { workspace = true, features = ["mcp"] }
ares-store = { workspace = true, features = ["postgres"] }
tracing = { workspace = true }
chrono = { workspace = true }
daedra = { version = "0.5.12", default-features = false }
scraper = { version = "0.25.0" }
tokio = { workspace = true }
toml = "0.9.8"
wiremock = "0.6.5"
sqlx = { workspace = true }
