<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
  <defs>
    <linearGradient id="gLeft" x1="100%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#785A28"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#785A28"/>
    </linearGradient>
    <linearGradient id="navy" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1C3054"/>
      <stop offset="100%" stop-color="#0F1D33"/>
    </linearGradient>
  </defs>

  <!-- LEFT WING — angular gold feathers, 5 blade shapes -->
  <polygon points="320,130 280,115 220,80 140,42 10,8 50,48 25,32 75,68" fill="url(#gLeft)"/>
  <polygon points="320,130 270,120 195,90 105,52 25,32 75,68 55,58 110,85" fill="url(#gLeft)" opacity="0.85"/>
  <polygon points="320,138 285,128 225,105 155,78 80,58 130,88 110,80 170,105" fill="url(#gLeft)" opacity="0.7"/>
  <!-- Left wing inner navy -->
  <polygon points="320,142 290,132 240,115 185,95 140,82 180,102 165,98 215,115 200,112 260,130 250,128 305,140" fill="url(#navy)"/>

  <!-- RIGHT WING — mirror -->
  <polygon points="320,130 360,115 420,80 500,42 630,8 590,48 615,32 565,68" fill="url(#gRight)"/>
  <polygon points="320,130 370,120 445,90 535,52 615,32 565,68 585,58 530,85" fill="url(#gRight)" opacity="0.85"/>
  <polygon points="320,138 355,128 415,105 485,78 560,58 510,88 530,80 470,105" fill="url(#gRight)" opacity="0.7"/>
  <!-- Right wing inner navy -->
  <polygon points="320,142 350,132 400,115 455,95 500,82 460,102 475,98 425,115 440,112 380,130 390,128 335,140" fill="url(#navy)"/>

  <!-- HEAD — angular, sharp beak pointing down -->
  <polygon points="305,118 320,80 335,118 328,125 320,130 312,125" fill="url(#navy)"/>
  <!-- Beak — sharp gold triangle -->
  <polygon points="315,108 320,92 325,108" fill="#C89B3C"/>
  <!-- Eyes — narrow slits, fierce -->
  <line x1="308" y1="104" x2="314" y2="102" stroke="#C89B3C" stroke-width="2" stroke-linecap="round"/>
  <line x1="326" y1="102" x2="332" y2="104" stroke="#C89B3C" stroke-width="2" stroke-linecap="round"/>

  <!-- BODY — angular navy shield shape -->
  <polygon points="285,142 320,155 355,142 348,198 320,215 292,198" fill="url(#navy)"/>

  <!-- ARES TEXT — tight, bold, gold -->
  <text x="320" y="195" text-anchor="middle"
        font-family="'Trebuchet MS','Arial Black','Impact',sans-serif"
        font-weight="900" font-size="28" font-style="italic"
        fill="#C89B3C" letter-spacing="6">ARES</text>

  <!-- TAIL — sharp angular navy -->
  <polygon points="308,200 300,245 312,228 320,255 328,228 340,245 332,200" fill="url(#navy)"/>
  <!-- Tail accent -->
  <polygon points="313,210 308,238 318,225 320,245 322,225 332,238 327,210" fill="#C89B3C" opacity="0.12"/>
</svg>
