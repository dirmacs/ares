[package]
name = "ares-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "Database and vector store clients for ARES"
[features]
default = []
postgres = ["dep:sqlx"]
turso = ["dep:libsql"]
ares-vector = ["dep:ares-vector"]
lancedb = ["dep:lancedb"]
qdrant = ["dep:qdrant-client"]
chromadb = ["dep:chromadb"]
pinecone = ["dep:pinecone-sdk"]
pgvector = ["postgres"]
[dependencies]
ares-types = { workspace = true }
ares-config = { workspace = true }
cordis = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
cron = "0.15"
hex = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
libsql = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
ares-vector = { workspace = true, features = ["serde"], optional = true }
qdrant-client = { workspace = true, optional = true }
lancedb = { workspace = true, optional = true }
chromadb = { workspace = true, optional = true }
pinecone-sdk = { workspace = true, optional = true }
rust_decimal = { workspace = true }
[dev-dependencies]
chrono = { workspace = true }
matches = "0.1"
rust_decimal_macros = { version = "1.36" }
tempfile = "3"
tokio = { workspace = true }
