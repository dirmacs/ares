[package]
name = "ares-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "Database and vector store clients for ARES"
[features]
default = []
# Compile-time factory collection (mirrors the server root feature)
inventory = ["dep:inventory", "cordis/inventory"]
postgres = ["dep:sqlx", "dep:sqlx-core", "dep:sqlx-postgres"]
turso = ["dep:libsql"]
ares-vector = ["dep:ares-vector"]
lancedb = ["dep:lancedb"]
qdrant = ["dep:qdrant-client"]
chromadb = ["dep:chromadb"]
pinecone = ["dep:pinecone-sdk"]
pgvector = ["postgres"]
[dependencies]
ares-types = { workspace = true }
cordis = { workspace = true, default-features = false }
inventory = { workspace = true, optional = true }
aes-gcm = "0.10"
arc-swap = "1.7.1"
thiserror = { workspace = true }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
cron = "0.15"
hex = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
sqlx-core = { workspace = true, optional = true }
# The Postgres `Migrate` impl (`Migrate for PgConnection`) that `Migrator::run`
# needs for a `PgPool`. Its `migrate` feature is a forward to `sqlx-core/migrate`;
# it does not pull in the sqlite driver.
sqlx-postgres = { workspace = true, optional = true }
libsql = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
ares-vector = { workspace = true, features = ["serde"], optional = true }
qdrant-client = { workspace = true, optional = true }
lancedb = { workspace = true, optional = true }
chromadb = { workspace = true, optional = true }
pinecone-sdk = { workspace = true, optional = true }
rust_decimal = { workspace = true }
[build-dependencies]
# The build script computes each migration's sha384 itself, matching
# `sqlx_core::migrate::Migration::new` exactly (sha2 + hex, same digest, same
# byte order), so the generated `checksum` literal is what sqlx would have
# recorded. sqlx-core is a build dependency only for the `Migration` type path.
sha2 = { workspace = true }
hex = { workspace = true }
[dev-dependencies]
ares-test-support = { workspace = true }
chrono = { workspace = true }
matches = "0.1"
rust_decimal_macros = { version = "1.36" }
tempfile = "3"
tokio = { workspace = true }
# Config round-trip test serialises a DatabaseConfig through TOML, because that
# is the format operators actually write.
toml = "0.9.8"
