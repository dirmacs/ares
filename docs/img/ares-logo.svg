<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldL" x1="100%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="goldR" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Left wing — outer gold feathers -->
  <path d="M320 140 L260 120 L180 85 L100 55 L30 30 L60 60 L20 45 L70 80 L35 68 L95 100 L65 92 L130 118 L105 112 L175 132 L155 128 L230 142 L215 140 L280 148" fill="url(#goldL)" opacity="0.95"/>
