[book]
title = "ARES documentation"
authors = ["Dirmacs"]
description = "Documentation for ARES, an agent platform with multi-provider LLM support, tool calling, RAG, and multi-tenant support."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/dirmacs/ares"
edit-url-template = "https://github.com/dirmacs/ares/edit/main/docs/{path}"
site-url = "/ares/"
no-section-label = false
mathjax-support = true

[output.html.search]
enable = true
limit-results = 30
boost-hierarchy = 2

[output.html.fold]
enable = true
level = 1
