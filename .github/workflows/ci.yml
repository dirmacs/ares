name: CI

on:
  push:
    branches: [main, develop, holy]
  pull_request:
    branches: [main, develop, holy]

env:
  CARGO_TERM_COLOR: always
  # The pin the ARES tree integrates against (crates/ares-tools Cargo.toml).
  APPA_REV: 1c52575176330bc88a3c346abe678af5d42083b3

jobs:
  policy:
    name: OpenAPPA Policy Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the APPA CLI from the pinned source
        run: cargo install --git https://github.com/archestra-ai/OpenAPPA --rev "$APPA_REV" --locked --bin appa
      - name: The complete test configuration loads and the replay suite proves it can fail
        run: ./scripts/appa-policy-gate.sh appa
  crap:
    name: CRAP Score Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-crap
        run: cargo install cargo-crap
      - name: Run CRAP check
        run: cargo crap --workspace --format json --threshold 30 --fail-above
  headless:
    name: Headless Facade Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check headless library build
        run: cargo check -p ares-server --lib --no-default-features
      - name: Check headless example (facade completeness)
        run: cargo check -p ares-server --example headless --no-default-features
      - name: Assert headless dependency tree
        run: |
          if cargo tree -p ares-server -e normal --no-default-features --prefix none \
            | grep -E '^(axum|ares-http|clap|tower-sessions|tower_governor|boa_engine|rhai|ollama-rs|sqlx|ares-mcp|rmcp|argon2|jsonwebtoken)( |$)'; then
            echo "::error::headless build pulled a web/CLI/script dependency into the tree"
            exit 1
          fi
