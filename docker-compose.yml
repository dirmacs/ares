# A.R.E.S production container contract.
#
# This stack intentionally keeps Caddy and PostgreSQL host-native. Provide a
# container-safe config at /etc/dirmacs/ares/ares.toml with:
#   [server] host = "0.0.0.0", port = 3000
#   [database] url = "postgres://..." or a host-gateway/native Postgres URL.
# Secrets stay in /etc/dirmacs/ares.env and are never copied into the image.

services:
  ares:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FEATURES: openai,postgres,mcp
        EXTRA_CARGO_ARGS: --no-default-features
    image: dirmacs/ares:${ARES_IMAGE_TAG:-local}
    container_name: ares
    restart: unless-stopped
    init: true
    env_file:
      - path: ${ARES_ENV_FILE:-/etc/dirmacs/ares.env}
        required: false
    environment:
      ARES_CONFIG: /app/ares.toml
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/dirmacs/ares/ares.toml:/app/ares.toml:ro
      - /etc/dirmacs/ares/config:/app/config:ro
      - ares_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ares_data:
