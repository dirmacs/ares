# Cordis plugin entries loaded at startup.
# Each entry names a plugin to instantiate with optional config.
# The Loader reconciles this file against running state on startup and hot-reload.
# Order matters: later factories read earlier services from Context.

[[entry]]
id = "events"
plugin = "EventsService"
disabled = false

[entry.config]

[[entry]]
id = "overlay"
plugin = "Overlay"
disabled = false

[entry.config]

[[entry]]
id = "store"
plugin = "Store"
disabled = false

[entry.config]

# Shared middle block: tools, llm, execute, auth, scheduler, pipeline,
# trigger, health, calculator, probe — spliced IN PLACE at this position
# from cordis-entries-shared.toml (same directory; relative path).
[[entry]]
id = "pull-shared-services"
plugin = "@include"
disabled = false

[entry.config]
path = "cordis-entries-shared.toml"

[[entry]]
id = "http"
plugin = "Http"
disabled = false

[entry.config]

# Emergency kill-switch: any scheduled run whose agent_name is exactly
# "EMERGENCY-HALT" is denied (fail closed: on_error = "deny" turns script
# errors into denies too). Renaming or retuning usage requires an admin
# reload of this entries program to take effect.
[[entry]]
id = "policy-emergency-gate"
plugin = "RhaiPolicy"
isolate = "policy-emergency"
disabled = false

[entry.config]
script = """
fn halt(p) { if p.agent_name == "EMERGENCY-HALT" { #{deny: "emergency-halt"} } else { () } }
"""

[[entry.config.listen]]
event = "scheduler.admit"
fn_name = "halt"
on_error = "deny"

# Admission audit: logs every admitted scheduled run and passes the payload
# through unchanged (`agent_name` comes from SchedulerAdmitPayload). Script
# errors pass through too (listener default on_error = "passthrough").
[[entry]]
id = "policy-admission-audit"
plugin = "RhaiPolicy"
isolate = "policy-audit"
disabled = false

[entry.config]
script = """
fn audit(p) { log(`admission agent=${p.agent_name}`); () }
"""

[[entry.config.listen]]
event = "scheduler.admit"
fn_name = "audit"

# RhaiPolicy — sandboxed script listeners on catalog events (feature "rhai").
# Returning ()/null passes through or delegates to the chain; any other value
# becomes the dispatch result (Bail deny marker, or waterfall short-circuit).
