[package]
name = "ares-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Model Context Protocol integration for A.R.E.S"
[features]
default = ["mcp", "postgres"]
mcp = ["dep:rmcp","dep:reqwest","dep:serde","dep:serde_json","dep:thiserror","dep:tokio","dep:tracing","dep:toml","dep:toon-format"]
postgres = ["dep:sqlx","dep:ares-db","ares-db/postgres"]
[dependencies]
ares-types = { workspace = true }
ares-db = { workspace = true, optional = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
toon-format = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3.23"
tokio-util = "0.7"
wiremock = "0.6.5"
