# id = "pull-shared-skills"
# plugin = "@include"
# [entry.config]
# path = "cordis-entries-shared.toml"
#
# @group usage — flatten inline children in place. The RhaiPolicy child below
# uses ${rhai: entry.id} interpolation INSIDE its script string (the scope
# variable is `entry`, not `$entry`: rhai reserves `$` in its parser) and
# fails closed via on_error = "deny":
