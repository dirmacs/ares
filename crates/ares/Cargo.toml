[package]
name = "ares"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "ARES agent library"

[features]
default = []
http = ["dep:ares-http", "ares-http/inventory"]
postgres = ["ares-store/postgres", "ares-agent/postgres", "ares-http/postgres"]
openai = ["ares-llm/openai"]
mcp = ["ares-tools/mcp"]
scheduler = ["ares-agent/scheduler"]
pipeline = ["ares-agent/pipeline"]
trigger = ["ares-agent/trigger"]
skills = ["ares-agent/skills"]
workflows = ["ares-agent/workflows"]
# Compile-time factory collection (mirrors the server root feature)
inventory = [
    "cordis/inventory",
    "ares-agent/inventory",
    "ares-tools/inventory",
    "ares-llm/inventory",
    "ares-store/inventory",
]
rhai = ["cordis/rhai"]

[dependencies]
cordis = { workspace = true }
ares-types = { workspace = true }
ares-agent = { workspace = true }
ares-tools = { workspace = true }
ares-llm = { workspace = true }
ares-store = { workspace = true }
ares-http = { workspace = true, optional = true }

[dev-dependencies]
ares-llm = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = "0.3"
