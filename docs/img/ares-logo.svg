  <path d="M320 148 L270 135 L200 112 L140 95 L90 78 L130 100 L100 92 L160 115 L140 110 L210 130 L195 126 L270 142 L260 140 L310 148" fill="#1B2A4A"/>

  <!-- Right wing — outer gold feathers -->
