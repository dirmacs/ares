  <path d="M320 148 L370 135 L440 112 L500 95 L550 78 L510 100 L540 92 L480 115 L500 110 L430 130 L445 126 L370 142 L380 140 L330 148" fill="#1B2A4A"/>

  <!-- Eagle head -->
  <path d="M300 115 Q305 90 320 82 Q335 90 340 115 L335 128 Q320 135 305 128 Z" fill="#1B2A4A"/>
  <!-- Beak -->
  <path d="M314 108 L320 95 L326 108 Z" fill="#DAA520"/>
  <!-- Eyes -->
  <circle cx="311" cy="102" r="2.5" fill="#F0E68C"/>
  <circle cx="329" cy="102" r="2.5" fill="#F0E68C"/>

  <!-- Eagle body (navy) -->
  <path d="M280 148 Q300 158 320 165 Q340 158 360 148 L350 195 Q335 215 320 220 Q305 215 290 195 Z" fill="#1B2A4A"/>

  <!-- ARES text integrated into body -->
  <text x="320" y="192" text-anchor="middle" font-family="'Georgia','Times New Roman',serif" font-weight="bold" font-size="30" fill="#DAA520" letter-spacing="6">ARES</text>

  <!-- Tail feathers -->
  <path d="M305 200 L298 240 L310 225 L320 248 L330 225 L342 240 L335 200" fill="#1B2A4A" opacity="0.85"/>
  <path d="M310 210 L305 235 L315 222 L320 240 L325 222 L335 235 L330 210" fill="#DAA520" opacity="0.3"/>
</svg>
