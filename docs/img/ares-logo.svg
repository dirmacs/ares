<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" fill="none">
  <defs>
    <linearGradient id="gL" x1="100%" y1="0%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#6B4E0A"/>
    </linearGradient>
    <linearGradient id="gR" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#6B4E0A"/>
    </linearGradient>
    <linearGradient id="nv" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1A2D4D"/>
      <stop offset="100%" stop-color="#0C1525"/>
    </linearGradient>
  </defs>

  <!-- LEFT WING: 4 angular blade feathers, each a simple triangle -->
  <polygon points="300,120 20,10 80,60" fill="url(#gL)"/>
  <polygon points="300,125 50,30 105,72" fill="url(#gL)" opacity="0.88"/>
  <polygon points="300,130 85,50 135,88" fill="url(#gL)" opacity="0.76"/>
  <polygon points="300,135 120,68 175,102" fill="url(#gL)" opacity="0.64"/>
  <!-- Left inner navy mass -->
  <polygon points="300,140 155,90 195,110 235,125 270,135" fill="url(#nv)"/>

  <!-- RIGHT WING: mirror -->
  <polygon points="300,120 580,10 520,60" fill="url(#gR)"/>
  <polygon points="300,125 550,30 495,72" fill="url(#gR)" opacity="0.88"/>
  <polygon points="300,130 515,50 465,88" fill="url(#gR)" opacity="0.76"/>
  <polygon points="300,135 480,68 425,102" fill="url(#gR)" opacity="0.64"/>
  <!-- Right inner navy mass -->
  <polygon points="300,140 445,90 405,110 365,125 330,135" fill="url(#nv)"/>

  <!-- HEAD: simple angular shape -->
  <polygon points="288,110 300,72 312,110 306,122 300,128 294,122" fill="url(#nv)"/>
  <!-- Beak -->
  <polygon points="296,102 300,88 304,102" fill="#C9A227"/>
  <!-- Eyes: minimal slits -->
  <line x1="290" y1="98" x2="296" y2="96" stroke="#C9A227" stroke-width="1.8"/>
  <line x1="304" y1="96" x2="310" y2="98" stroke="#C9A227" stroke-width="1.8"/>

  <!-- BODY: angular shield -->
  <polygon points="270,140 300,152 330,140 324,196 300,210 276,196" fill="url(#nv)"/>

  <!-- ARES text -->
  <text x="300" y="193" text-anchor="middle"
        font-family="'Impact','Arial Black','Helvetica',sans-serif"
        font-weight="900" font-size="26" font-style="italic"
        fill="#C9A227" letter-spacing="7">ARES</text>

  <!-- TAIL: 3 sharp chevrons -->
  <polygon points="292,198 286,240 298,224 300,250 302,224 314,240 308,198" fill="url(#nv)"/>
</svg>
