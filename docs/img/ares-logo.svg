<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" fill="none">
  <defs>
    <linearGradient id="wingGoldL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="40%" stop-color="#C49A3C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="wingGoldR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A843"/>
      <stop offset="40%" stop-color="#C49A3C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E3156"/>
      <stop offset="100%" stop-color="#142240"/>
    </linearGradient>
  </defs>

  <!-- LEFT WING — outer gold feather layer -->
  <path d="M310 140 C280 125 220 95 150 65 C100 45 50 28 15 18 C35 38 20 30 45 50 C60 62 40 55 75 75 C95 88 80 82 115 100 C140 112 128 108 165 122 C190 130 180 128 220 136 C245 140 240 139 275 143 L310 148"
        fill="url(#wingGoldL)"/>
  <!-- LEFT WING — inner navy layer -->
  <path d="M310 148 C290 140 250 125 200 108 C160 95 125 82 95 72 C115 85 100 80 135 98 C160 108 150 105 185 118 C210 126 205 124 240 134 C260 139 258 138 290 144 L310 148"
        fill="#1B2A4A"/>

  <!-- RIGHT WING — outer gold feather layer -->
  <path d="M330 140 C360 125 420 95 490 65 C540 45 590 28 625 18 C605 38 620 30 595 50 C580 62 600 55 565 75 C545 88 560 82 525 100 C500 112 512 108 475 122 C450 130 460 128 420 136 C395 140 400 139 365 143 L330 148"
        fill="url(#wingGoldR)"/>
  <!-- RIGHT WING — inner navy layer -->
  <path d="M330 148 C350 140 390 125 440 108 C480 95 515 82 545 72 C525 85 540 80 505 98 C480 108 490 105 455 118 C430 126 435 124 400 134 C380 139 382 138 350 144 L330 148"
        fill="#1B2A4A"/>

  <!-- EAGLE HEAD — navy silhouette -->
  <path d="M302 120 C305 100 312 88 320 82 C328 88 335 100 338 120 L335 132 C328 138 312 138 305 132 Z"
        fill="url(#bodyGrad)"/>
  <!-- Beak — gold -->
  <path d="M314 112 L320 97 L326 112" fill="#C49A3C" stroke="#A07830" stroke-width="0.5"/>
  <!-- Eyes -->
  <ellipse cx="311" cy="105" rx="2.5" ry="2" fill="#E8D5A3"/>
  <ellipse cx="329" cy="105" rx="2.5" ry="2" fill="#E8D5A3"/>
  <circle cx="311" cy="105" r="1" fill="#0D1117"/>
  <circle cx="329" cy="105" r="1" fill="#0D1117"/>

  <!-- EAGLE BODY — navy, broader chest -->
  <path d="M278 148 C290 155 305 162 320 168 C335 162 350 155 362 148 L355 200 C348 218 336 232 320 238 C304 232 292 218 285 200 Z"
        fill="url(#bodyGrad)"/>

  <!-- ARES TEXT — gold, integrated into body -->
  <text x="320" y="210" text-anchor="middle"
        font-family="'Palatino Linotype','Book Antiqua','Georgia',serif"
        font-weight="bold" font-size="32"
        fill="#C49A3C" letter-spacing="8"
        stroke="#A07830" stroke-width="0.3">ARES</text>

  <!-- TAIL FEATHERS — navy with gold highlights -->
  <path d="M305 220 L296 265 L308 248 L320 275 L332 248 L344 265 L335 220"
        fill="#1B2A4A"/>
  <path d="M310 228 L304 255 L314 243 L320 265 L326 243 L336 255 L330 228"
        fill="#C49A3C" opacity="0.15"/>

  <!-- Wing tip details — gold feather strands on left -->
  <line x1="15" y1="18" x2="45" y2="42" stroke="#D4A843" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="28" x2="55" y2="52" stroke="#D4A843" stroke-width="1.5" opacity="0.6"/>
  <line x1="38" y1="38" x2="68" y2="62" stroke="#D4A843" stroke-width="1.5" opacity="0.6"/>

  <!-- Wing tip details — gold feather strands on right -->
  <line x1="625" y1="18" x2="595" y2="42" stroke="#D4A843" stroke-width="1.5" opacity="0.6"/>
  <line x1="615" y1="28" x2="585" y2="52" stroke="#D4A843" stroke-width="1.5" opacity="0.6"/>
  <line x1="602" y1="38" x2="572" y2="62" stroke="#D4A843" stroke-width="1.5" opacity="0.6"/>
</svg>
