name: Open Source Guard
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for proprietary leaks
        run: |
          TERMS="kas""ino|eh""b|ehe""alth|dink""edin|dspr""int|dirmacs-serv""ice-key|bom@dirm""acs|eruka-con""text\.toml"
          if grep -rnE "$TERMS" src/ crates/ tests/ docs/ examples/ README.md 2>/dev/null; then
            echo "::error::Proprietary content detected in open-source repo"
            exit 1
          fi
          echo "No proprietary content found"
      - name: Check for committed credentials
        run: |
          LEAKS=$(grep -rInE \
            '-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY|AKIA[0-9A-Z]{16}|postgres(ql)?://[^/[:space:]]+:[^/[:space:]]+@|xox[baprs]-[A-Za-z0-9-]{10,}|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}' \
            src/ crates/ tests/ docs/ examples/ 2>/dev/null | grep -vE 'localhost|127\.0\.0\.1|example\.|<' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Credential-like content committed:"
            echo "$LEAKS"
            exit 1
          fi
          echo "No credential-like content found"
