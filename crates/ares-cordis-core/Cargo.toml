[package]
name = "ares-cordis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "Cordis primitives for ARES: context, fiber, effect, and events. Leaf crate with no other ARES dependencies"

[features]
# HMR via libloading — deferred per docs/cordis-mapping.md §11, off by default.
# When enabled, `hmr` module dlopens a .so and calls Plugin::apply via extern "C".
# ABI fragility forces fallback to file-watch + full fiber reload (90% value).
hmr = ["dep:libloading"]
inventory = ["dep:inventory"]
linkme = ["dep:linkme"]
# Rhai scripting for Cordis — safe hot-reloadable logic for Services/Plugins/Fibers
rhai = ["dep:rhai", "rhai/sync"]
default = ["inventory"]

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
notify = "8.2.0"
rhai = { workspace = true, optional = true }
libloading = { version = "0.8", optional = true }
inventory = { version = "0.3", optional = true }
linkme = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.10"
