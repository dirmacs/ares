[package]
name = "ares-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "Agent orchestration for ARES"

[features]
default = []
# Compile-time factory collection (mirrors the server root feature)
inventory = ["dep:inventory", "cordis/inventory"]
postgres = ["dep:sqlx", "dep:ares-store", "ares-store/postgres", "ares-llm/postgres", "ares-llm/ollama", "ares-tools/postgres"]
eruka-context = []
scheduler = ["postgres", "dep:cron"]
pipeline = ["postgres"]
trigger = ["postgres"]
skills = ["dep:thulp-skill-files"]
workflows = ["postgres"]

[dependencies]
ares-types = { workspace = true }
ares-llm = { workspace = true, features = ["ollama"] }
ares-tools = { workspace = true }
ares-store = { workspace = true, optional = true }
cordis = { workspace = true }
inventory = { workspace = true, optional = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
futures = "0.3.31"
uuid = { workspace = true }
cron = { version = "0.15", optional = true }
parking_lot = { workspace = true }
rust_decimal = { workspace = true }
thulp-skill-files = { version = "0.3", optional = true }

[dev-dependencies]
wiremock = "0.6.5"
tempfile = "3.14"
dotenvy = "0.15.7"
uuid = { workspace = true }
axum = { version = "0.8.7", features = ["macros"] }
