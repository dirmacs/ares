[package]
name = "ares-cordis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "Cordis primitives for ARES: context, fiber, effect, and events. Leaf crate with no other ARES dependencies"

[lib]
name = "cordis"

[features]
# HMR via libloading — off by default. Enables dlopen of plugin .so files
# (same toolchain as the server) and retains them in HmrRegistry.
hmr = ["dep:libloading"]
inventory = ["dep:inventory"]
linkme = ["dep:linkme"]
# Rhai scripting for Cordis — safe hot-reloadable logic for Services/Plugins/Fibers
rhai = ["dep:rhai", "rhai/sync"]
default = ["inventory"]

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
notify = "8.2.0"
rhai = { workspace = true, optional = true }
libloading = { version = "0.8", optional = true }
inventory = { version = "0.3", optional = true }
linkme = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.10"
