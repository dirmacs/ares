# PROPOSED battery — the estate's identity directory as the authority source.
# Not applied: this text composes under config/appa.proposed.toml only.
#
# The directory holds `users` and `user_identities` (one user, many
# identities), the role rank hierarchy, and product-scoped claims. The
# engine's authority and audience bindings read that directory; the mandate
# envelope enforces #321's approval semantics.

[policy]
version = 2

# The tenant boundary the estate's own records define: members of the tenant
# are the internal readers.
[policy.audience]
internal = ["@directory:tenant-members"]

# A human reviewer with the role rank to clear a classification or approve a
# side effect. `hitl` is the runtime's human-approval channel; the directory
# decides who that is.
[[policy.authority]]
name = "directory-reviewer"
permits = { attention = ["classification-cleared", "change-approved"] }

[externals.authorities.directory-reviewer]
builtin = "hitl"

[externals.audience.directory]
url = "https://directory.internal/appa/members"
token_env = "DIRECTORY_SERVICE_KEY"
